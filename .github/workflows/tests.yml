name: Testy — Zarządzanie Twoją Pocztą
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdzenie składni
        run: python -m compileall -q outlook_cleaner.py tests
      - name: Testy jednostkowe i symulacja Graph
        run: python -m unittest discover -s tests -v
      - name: Demo bez logowania
        run: python outlook_cleaner.py --demo
